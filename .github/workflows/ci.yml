name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm test

  emulator-kitty:
    name: emulator-kitty
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install virtual display dependencies
        run: sudo apt-get update && sudo apt-get install --yes fonts-dejavu-core imagemagick libgl1-mesa-dri libxcb-xkb1 x11-utils xvfb
      - name: Install pinned Kitty emulator
        run: |
          node scripts/install-kitty-emulator.mjs "$RUNNER_TEMP/kitty"
          echo "TERMINAL_UI_KITTY=$RUNNER_TEMP/kitty/bin/kitty" >> "$GITHUB_ENV"
          echo "TERMINAL_UI_KITTEN=$RUNNER_TEMP/kitty/bin/kitten" >> "$GITHUB_ENV"
      - name: Run real-emulator conformance
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run check:emulator:kitty
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kitty-emulator-evidence
          path: .artifacts/emulator/kitty
          if-no-files-found: error
          retention-days: 14
