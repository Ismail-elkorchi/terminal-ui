name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: 24.14.0

jobs:
  linux-static:
    name: linux-static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:hygiene
      - run: npm run check:release
      - run: npm run check:architecture
      - run: npm run check:api
      - run: npm run lint
      - run: npm run check:test-types
      - run: npm run check:examples

  linux-tests:
    name: linux-${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [acceptance, conformance, integration, package, property, security, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:${{ matrix.lane }}

  linux-fast:
    name: linux-fast
    if: always()
    needs: [linux-static, linux-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every fast Linux lane
        env:
          STATIC_RESULT: ${{ needs.linux-static.result }}
          TEST_RESULT: ${{ needs.linux-tests.result }}
        run: test "$STATIC_RESULT" = success && test "$TEST_RESULT" = success

  linux-full:
    name: linux-full
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - run: npm run check:consumer
      - run: npm run check:runtime
      - run: npm run check:jsr
      - run: npm run check:performance

  host-smoke:
    name: ${{ matrix.os }}-host-smoke
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/runtime-smoke.mjs
      - run: node --test tests/integration/node-host-lifecycle.test.mjs
      - run: npm run check:package
