name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to retry
        required: true
        type: string
      registry:
        description: Registry to retry
        required: true
        type: choice
        options:
          - npm
          - jsr

permissions:
  contents: read

env:
  NODE_VERSION: 24.14.0
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run check:release
      - run: npm run check

  verify-emulator:
    name: verify-release-emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install virtual display dependencies
        run: sudo apt-get update && sudo apt-get install --yes fonts-dejavu-core imagemagick libgl1-mesa-dri x11-utils xvfb
      - name: Install pinned Kitty emulator
        run: |
          node scripts/install-kitty-emulator.mjs "$RUNNER_TEMP/kitty"
          echo "TERMINAL_UI_KITTY=$RUNNER_TEMP/kitty/bin/kitty" >> "$GITHUB_ENV"
          echo "TERMINAL_UI_KITTEN=$RUNNER_TEMP/kitty/bin/kitten" >> "$GITHUB_ENV"
      - name: Run real-emulator conformance
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run check:emulator:kitty
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kitty-release-emulator-evidence-${{ env.RELEASE_TAG }}
          path: .artifacts/emulator/kitty
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    name: publish-npm
    needs: [verify, verify-emulator]
    if: github.event_name == 'release' || inputs.registry == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check:release
      - name: Publish npm package
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}

  publish-jsr:
    name: publish-jsr
    needs: [verify, verify-emulator]
    if: github.event_name == 'release' || inputs.registry == 'jsr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.0
      - run: npm ci --ignore-scripts
      - run: npm run check:release
      - run: deno publish
